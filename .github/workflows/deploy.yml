name: Deploy (database migrations)

# Vercel builds and deploys the Next.js app via its native Git integration on
# push to main. This workflow's only job is to apply Supabase database
# migrations so schema changes ship with the code instead of being run by hand
# in the SQL editor.
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   - database password (Project Settings -> Database)
# The project ref below is public (it is the subdomain of NEXT_PUBLIC_SUPABASE_URL).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

# Never let two migration runs race against the same database.
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project and push migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: lbydgfvvsklxeebwnnfg
