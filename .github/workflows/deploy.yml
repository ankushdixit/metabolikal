name: Deploy (database migrations)

# Vercel builds and deploys the Next.js app via its native Git integration on
# push to main. This workflow's only job is to apply Supabase database
# migrations so schema changes ship with the code instead of being run by hand
# in the SQL editor.
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   - database password (Project Settings -> Database)
# The project ref below is public (it is the subdomain of NEXT_PUBLIC_SUPABASE_URL).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

# Never let two migration runs race against the same database.
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: lbydgfvvsklxeebwnnfg

      # Surface exactly which migrations are pending vs already applied on the
      # remote, so the first run (after migrations that were applied by hand and
      # aren't in the remote history) is auditable in the logs before anything
      # is written. Run `supabase migration repair --status applied <version>`
      # to mark a hand-applied migration as done so it isn't re-pushed.
      - name: Show migration status
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
